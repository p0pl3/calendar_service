apiVersion: v1
kind: Secret
metadata:
  name: calendar-secret
  namespace: calendar
type: Opaque
stringData:
  POSTGRES_USER: "caluser"
  POSTGRES_PASSWORD: "calpass"
  RABBITMQ_DEFAULT_USER: "rabbituser"
  RABBITMQ_DEFAULT_PASS: "rabbitpass"
  RABBITMQ_URL: "amqp://rabbituser:rabbitpass@rabbitmq:5672/"
  SECRET_KEY: "replace-with-random-secret-key"
  SMTP_USER: "your-email@gmail.com"
  SMTP_PASSWORD: "your-app-password"
  SMTP_FROM: "Calendar Reminder<your-email@gmail.com>"
