apiVersion: v1
kind: ConfigMap
metadata:
  name: calendar-config
  namespace: calendar
data:
  POSTGRES_DB: "calendar_db"
  ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "60"
  SERVICE_PORT_USER: "8001"
  SERVICE_PORT_EVENT: "8002"
  SERVICE_PORT_NOTIFY: "8003"
  DATABASE_URL_USER: "postgresql+asyncpg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/calendar_db"
  DATABASE_URL_EVENT: "postgresql+asyncpg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/calendar_db"
  DATABASE_URL_SCHEDULER: "postgresql+psycopg2://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/calendar_db"
  REDIS_URL_USER: "redis://redis:6379/0"
  REDIS_URL_SCHEDULER: "redis://redis:6379/1"
  USER_SERVICE_URL: "http://user-service:8001"
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
