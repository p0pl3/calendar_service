apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: calendar
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: calendar/notification-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8003
          env:
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: calendar-secret
                  key: RABBITMQ_URL
            - name: SMTP_HOST
              valueFrom:
                configMapKeyRef:
                  name: calendar-config
                  key: SMTP_HOST
            - name: SMTP_PORT
              valueFrom:
                configMapKeyRef:
                  name: calendar-config
                  key: SMTP_PORT
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: calendar-secret
                  key: SMTP_USER
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: calendar-secret
                  key: SMTP_PASSWORD
            - name: SMTP_FROM
              valueFrom:
                secretKeyRef:
                  name: calendar-secret
                  key: SMTP_FROM
            - name: SERVICE_PORT
              value: "8003"
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
      terminationGracePeriodSeconds: 35
