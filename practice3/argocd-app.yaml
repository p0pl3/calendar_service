apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: calendar-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/p0pl3/calendar_service.git
    targetRevision: main
    path: practice3/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: calendar
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
