version: "3.9"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ─── Infrastructure ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-caluser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-calpass}
      POSTGRES_DB: ${POSTGRES_DB:-calendar_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${HOST_PORT_POSTGRES:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-caluser} -d ${POSTGRES_DB:-calendar_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${HOST_PORT_REDIS:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-rabbituser}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-rabbitpass}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "${HOST_PORT_RABBITMQ:-5672}:5672"
      - "${HOST_PORT_RABBITMQ_MGT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    logging: *default-logging

  # ─── Application Services ────────────────────────────────────────────────────
  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-caluser}:${POSTGRES_PASSWORD:-calpass}@postgres:5432/${POSTGRES_DB:-calendar_db}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-changeme32byteshexstringhere!!}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      SERVICE_PORT: "8001"
    ports:
      - "${HOST_PORT_USER_SVC:-8001}:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 35s
    logging: *default-logging

  event-service:
    build:
      context: ./services/event-service
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-caluser}:${POSTGRES_PASSWORD:-calpass}@postgres:5432/${POSTGRES_DB:-calendar_db}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-rabbituser}:${RABBITMQ_DEFAULT_PASS:-rabbitpass}@rabbitmq:5672/
      USER_SERVICE_URL: http://user-service:8001
      SECRET_KEY: ${SECRET_KEY:-changeme32byteshexstringhere!!}
      ALGORITHM: ${ALGORITHM:-HS256}
      SERVICE_PORT: "8002"
    ports:
      - "${HOST_PORT_EVENT_SVC:-8002}:8002"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      user-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 35s
    logging: *default-logging

  scheduler-service:
    build:
      context: ./services/scheduler-service
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-caluser}:${POSTGRES_PASSWORD:-calpass}@postgres:5432/${POSTGRES_DB:-calendar_db}
      REDIS_URL: redis://redis:6379/1
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-rabbituser}:${RABBITMQ_DEFAULT_PASS:-rabbitpass}@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    stop_grace_period: 35s
    logging: *default-logging

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-rabbituser}:${RABBITMQ_DEFAULT_PASS:-rabbitpass}@rabbitmq:5672/
      SERVICE_PORT: "8003"
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports:
      - "${HOST_PORT_NOTIFY_SVC:-8003}:8003"
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 35s
    logging: *default-logging

  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${HOST_PORT_API:-80}:80"
    depends_on:
      user-service:
        condition: service_healthy
      event-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging: *default-logging

  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${HOST_PORT_FRONTEND:-3000}:80"
    depends_on:
      - api-gateway
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:

networks:
  default:
    name: calendar-net
    driver: bridge
