apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-business
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  business-dashboard.json: |
    {
      "title": "Calendar App — Business KPIs",
      "uid": "calendar-business",
      "tags": ["calendar", "business"],
      "timezone": "browser",
      "schemaVersion": 38,
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "type": "gauge",
          "title": "Active User Sessions",
          "gridPos": {"x": 0, "y": 0, "w": 6, "h": 8},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "users_active_total"
            }
          ]
        },
        {
          "id": 2,
          "type": "gauge",
          "title": "Total Registered Users",
          "gridPos": {"x": 6, "y": 0, "w": 6, "h": 8},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "users_registered_total"
            }
          ]
        },
        {
          "id": 3,
          "type": "gauge",
          "title": "Total Events Created",
          "gridPos": {"x": 12, "y": 0, "w": 6, "h": 8},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "events_created_total"
            }
          ]
        },
        {
          "id": 4,
          "type": "gauge",
          "title": "Total Reminders Created",
          "gridPos": {"x": 18, "y": 0, "w": 6, "h": 8},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "reminders_created_total"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Notification Delivery Rate",
          "gridPos": {"x": 0, "y": 8, "w": 12, "h": 8},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "rate(notifications_sent_total[5m])",
              "legendFormat": "sent {{channel}}"
            },
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "rate(notifications_failed_total[5m])",
              "legendFormat": "failed {{channel}}"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Kubernetes Pod CPU & Memory (calendar namespace)",
          "gridPos": {"x": 12, "y": 8, "w": 12, "h": 8},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"calendar\",container!=\"linkerd-proxy\",container!=\"\"}[1m]))",
              "legendFormat": "CPU {{pod}}"
            }
          ]
        }
      ]
    }
