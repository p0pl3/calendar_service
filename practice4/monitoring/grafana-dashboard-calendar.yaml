apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-calendar
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  calendar-dashboard.json: |
    {
      "title": "Calendar App — HTTP & Business Metrics",
      "uid": "calendar-app",
      "tags": ["calendar"],
      "timezone": "browser",
      "schemaVersion": 38,
      "refresh": "15s",
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "HTTP Requests per Second (by service)",
          "gridPos": {"x": 0, "y": 0, "w": 12, "h": 8},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "sum by (job) (rate(http_requests_total[1m]))",
              "legendFormat": "{{job}}"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "HTTP Request Duration p95 (seconds)",
          "gridPos": {"x": 12, "y": 0, "w": 12, "h": 8},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "histogram_quantile(0.95, sum by (le, job) (rate(http_request_duration_seconds_bucket[1m])))",
              "legendFormat": "p95 {{job}}"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "HTTP Response Codes (by service)",
          "gridPos": {"x": 0, "y": 8, "w": 12, "h": 8},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "sum by (status_code, job) (rate(http_requests_total[1m]))",
              "legendFormat": "{{job}} {{status_code}}"
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Users Registered (total)",
          "gridPos": {"x": 12, "y": 8, "w": 4, "h": 4},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "users_registered_total"
            }
          ]
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Users Logged In (total)",
          "gridPos": {"x": 16, "y": 8, "w": 4, "h": 4},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "users_logged_in_total"
            }
          ]
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Events Created (total)",
          "gridPos": {"x": 20, "y": 8, "w": 4, "h": 4},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "events_created_total"
            }
          ]
        },
        {
          "id": 7,
          "type": "stat",
          "title": "Reminders Created (total)",
          "gridPos": {"x": 12, "y": 12, "w": 4, "h": 4},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "reminders_created_total"
            }
          ]
        },
        {
          "id": 8,
          "type": "stat",
          "title": "Notifications Sent (total)",
          "gridPos": {"x": 16, "y": 12, "w": 4, "h": 4},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "sum(notifications_sent_total)"
            }
          ]
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Business Operations Rate (per min)",
          "gridPos": {"x": 0, "y": 16, "w": 24, "h": 8},
          "targets": [
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "rate(users_registered_total[1m]) * 60",
              "legendFormat": "registrations/min"
            },
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "rate(users_logged_in_total[1m]) * 60",
              "legendFormat": "logins/min"
            },
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "rate(events_created_total[1m]) * 60",
              "legendFormat": "events/min"
            },
            {
              "datasource": {"type": "prometheus", "uid": "prometheus"},
              "expr": "rate(reminders_created_total[1m]) * 60",
              "legendFormat": "reminders/min"
            }
          ]
        }
      ]
    }
